name: Firmware Build and lint
on:
  push:
    paths:
      - 'firmware/**'
      - '!firmware/resources/**'
      - '.github/workflows/firmware_build_lint.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '!firmware/resources/**'
      - '.github/workflows/firmware_build_lint.yml'
  schedule:
    - cron: "0 3 1 * *" #Automatically run at 03:00 every 1st of the month

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
#
# Build the firmware on Linux and Windows
#
  build-linux:
    name: Build the firmware on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
            submodules: recursive
            lfs: false

      - name: Install GNU Arm Embedded Toolchain - latest
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        id: arm-none-eabi-gcc-action
        with:
          release: 'latest'

      - name: Configure CMake and build (Debug)
        working-directory: ${{ github.workspace }}/firmware
        run:  |
              cmake --preset Debug
              cmake --build --preset Debug

      - name: Configure CMake and build (Release)
        working-directory: ${{ github.workspace }}/firmware
        run:  |
              cmake --preset Release
              cmake --build --preset Release

      - name: Configure CMake and build (Unit-tests)
        working-directory: ${{ github.workspace }}/firmware
        run:  |
              cmake --preset HOSTgcc
              cmake --build --preset Tests

      - name: Save the Debug CMake configuration folder
        uses: actions/upload-artifact@v7
        with:
          name: build-Debug
          path: |
                ${{ github.workspace }}/firmware/build/Debug/compile_commands.json
                ${{ github.workspace }}/firmware/build/HOSTgcc/tests/test_stdlib
                ${{ github.workspace }}/firmware/build/HOSTgcc/tests/test_sensorfusion
                ${{ github.workspace }}/firmware/utils/softversion.h
                ${{ github.workspace }}/firmware/README.md
                ${{ github.workspace }}/firmware/Doxyfile
          if-no-files-found: error

#
# Test a build on a Windows machine
#
  testbuild-windows:
    name: Test a build on Windows
    runs-on: windows-latest
    needs: build-linux
    timeout-minutes: 10
    env:
      MSYS_SYS: ucrt64
      MSYS_ENV: ucrt-x86_64

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
            submodules: recursive
            lfs: false

      - name: Set up MSYS2
        id: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          update: false
          cache: true
          msystem: ${{env.MSYS_SYS}}
          install: >-
            mingw-w64-${{env.MSYS_ENV}}-arm-none-eabi-gcc
            mingw-w64-${{env.MSYS_ENV}}-cmake

      - name: Save the MSYS2 install directory in %PATH%
        shell: powershell
        run: |
          echo "${{ steps.setup-msys2.outputs.msys2-location }}/${{env.MSYS_SYS}}/bin" >> $env:GITHUB_PATH

      - name: Configure CMake and build (Debug)
        working-directory: ${{ github.workspace }}/firmware
        run:  |
              cmake --preset Debug
              cmake --build --preset Debug

#
# Run code quality and documentation checks
#
  code-quality:
    name: Linters and documentation tools
    runs-on: ubuntu-latest
    container:
      image: gilleshenrard/c-linters:latest
    timeout-minutes: 10
    needs: build-linux
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
            submodules: recursive
            lfs: false

      - name: Download the saved CMake configuration folder
        uses: actions/download-artifact@v8
        with:
          name: build-Debug
          path: ${{ github.workspace }}/firmware

      - name: Install GNU Arm Embedded Toolchain - latest
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        id: arm-none-eabi-gcc-action
        with:
          release: latest

      - name: Check the GNU Arm Embedded Toolchain triplet
        run: ls -la ${{ steps.arm-none-eabi-gcc-action.outputs.path }}/../arm-none-eabi

      - name: Prepare lint project files
        working-directory: ${{ github.workspace }}/firmware
        run: |
             sed -i 's/-fanalyzer//g; s/-fmax-errors=0//g' build/Debug/compile_commands.json
             sed -i "s,${{ github.workspace }}/firmware/,$PWD/,g" build/Debug/compile_commands.json
             mkdir -p /tmp/config-cppcheck-build-dir/

      - name: run clang-tidy
        id: clang-tidy
        working-directory: ${{ github.workspace }}/firmware
        continue-on-error: true
        run:  >
              run-clang-tidy
              -quiet
              -p build/Debug/
              -extra-arg=--sysroot=${{ steps.arm-none-eabi-gcc-action.outputs.path }}/../arm-none-eabi
              ".*(hardware|tasks|utils|tests|app|ui)/.*\\.(c|h|inc)$"

      - name: Run CppCheck
        id: cppcheck
        working-directory: ${{ github.workspace }}/firmware
        continue-on-error: true
        run:  >
              cppcheck
              --enable=all
              --safety
              --language=c
              --inconclusive
              --inline-suppr
              --check-level=exhaustive
              --error-exitcode=2
              --project=build/Debug/compile_commands.json
              --cppcheck-build-dir=/tmp/config-cppcheck-build-dir/
              --include=Core/Inc/FreeRTOSConfig.h
              --suppress=missingIncludeSystem
              --suppress=unmatchedSuppression
              --suppress=*:Core/**
              --suppress=*:Drivers/**
              --suppress=*:Middlewares/**
              -ibuild/

      - name: Run Lizard
        id: lizard
        continue-on-error: true
        run: >
          lizard
          -Tlength=60
          -Tnloc=60
          -Tparameter_count=5
          -Tcyclomatic_complexity=10
          -Eduplicate
          firmware/hardware/
          firmware/tasks/
          firmware/utils/
          firmware/app/
          firmware/tests/
          firmware/ui/

      - name: Run Doxygen
        id: doxygen
        continue-on-error: true
        run: doxygen firmware/Doxyfile

      - name: Check enums and structs members documentation
        id: enum_struct_check
        continue-on-error: true
        run: |
            python3 firmware/resources/check_enum_struct_members_doc.py firmware --ignore Core,Drivers,Middlewares
      
      - name: Check Clang-format
        id: clang-format
        continue-on-error: true
        working-directory: ${{ github.workspace }}/firmware
        run: |
          find . -type f \( -name '*.c' -o -name '*.h' -o -name '*.inc' \) -print > /tmp/clang-format-files.txt
          clang-format \
            --style=file \
            --dry-run \
            --Werror \
            --verbose \
            --files=/tmp/clang-format-files.txt

      - name: Check Doxygen @file tags
        id: doxygen-tags
        working-directory: ${{ github.workspace }}/firmware
        continue-on-error: true
        run: >
            python3 resources/check_doxygen_tags.py
            .
            --exclude build
            --exclude Drivers
            --exclude Middlewares
            --exclude Core

      - name: REUSE - Open source Copyright and Licensing
        id: reuse
        continue-on-error: true
        run: |
          reuse --include-submodules lint

      #File names and paths must contain only lowercase, numbers or underscores
      - name : Check for files naming convention
        id : filenames
        continue-on-error: true
        run : |
          chmod +x firmware/resources/check_filenames.sh
          ./firmware/resources/check_filenames.sh

      - name : Run unit tests
        id : unit-tests
        working-directory: ${{github.workspace}}/firmware
        continue-on-error: true
        run : |
              chmod +x build/HOSTgcc/tests/test_sensorfusion build/HOSTgcc/tests/test_stdlib
              build/HOSTgcc/tests/test_sensorfusion
              build/HOSTgcc/tests/test_stdlib

      - name: Final result
        run: |
          failed=0

          if [ "${{ steps.clang-tidy.outcome }}" != "success" ]; then
            echo "::error::clang-tidy failed"
            failed=1
          fi
          if [ "${{ steps.cppcheck.outcome }}" != "success" ]; then
            echo "::error::cppcheck failed"
            failed=1
          fi
          if [ "${{ steps.lizard.outcome }}" != "success" ]; then
            echo "::error::lizard failed"
            failed=1
          fi
          if [ "${{ steps.clang-format.outcome }}" != "success" ]; then
            echo "::error::clang-format failed"
            failed=1
          fi
          if [ "${{ steps.reuse.outcome }}" != "success" ]; then
            echo "::error::reuse failed"
            failed=1
          fi
          if [ "${{ steps.filenames.outcome }}" != "success" ]; then
            echo "::error::filenames failed"
            failed=1
          fi
          if [ "${{ steps.doxygen.outcome }}" != "success" ]; then
            echo "::error::doxygen failed"
            failed=1
          fi
          if [ "${{ steps.enum_struct_check.outcome }}" != "success" ]; then
            echo "::error::Enums and struct documentation failed"
            failed=1
          fi
          if [ "${{ steps.doxygen-tags.outcome }}" != "success" ]; then
            echo "::error::Doxygen @file tags failed"
            failed=1
          fi
          if [ "${{ steps.unit-tests.outcome }}" != "success" ]; then
            echo "::error::Unit tests failed"
            failed=1
          fi
          if [ $failed -eq 1 ]; then
            exit 1
          fi

